[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "timesfm-icf"
version = "0.1.0"
description = "In-Context Fine-Tuning extension for TimesFM with learnable separator tokens"
readme = "README.md"
license = {file = "LICENSE"}
authors = [
    {name = "TimesFM-ICF Contributors"},
]
keywords = ["time-series", "forecasting", "classification", "transformer", "in-context-learning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research", 
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.21.0",
    "pandas>=1.3.0",
    "dataclasses-json>=0.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=22.0.0",
    "isort>=5.0.0",
    "mypy>=0.900",
]

[project.urls]
Homepage = "https://github.com/google-research/timesfm"
Repository = "https://github.com/google-research/timesfm"

[tool.hatch.build.targets.wheel]
packages = ["src/timesfm_icf"]

[tool.black]
line-length = 88
target-version = ['py39']

[tool.isort]
profile = "black"
line_length = 88

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true